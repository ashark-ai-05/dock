name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Dock's tests drive real PTYs, real subprocesses, and real signals, so many of them wait on a
  # wall clock. Those deadlines are liveness backstops — they exist so a regression fails with a
  # message instead of hanging forever, not to assert how fast the runtime is. A shared CI runner
  # is slower and far more contended than a developer machine, so the budget that is comfortable
  # locally becomes a coin flip here. Scaling every budget buys headroom without weakening a
  # single assertion.
  DOCK_TEST_TIMEOUT_SCALE: "4"
  # CI-only failures are the ones hardest to reproduce; make the runner give up its evidence.
  RUST_BACKTRACE: "1"

# A superseded push has nothing left to prove; let the newer one have the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A deadlocked test would otherwise hold the runner for GitHub's six-hour default. Dock's suite
    # finishes in about a minute, so anything past this is a hang, not slow hardware.
    timeout-minutes: 30
    strategy:
      # Dock is developed on macOS and deployed on both. A red Linux job must never hide a red
      # macOS one, so neither cancels the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

    - name: Cache cargo registry and build output
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Formatting
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --all-targets

    - name: Test
      run: cargo test --all-targets

    # These drive a real daemon over a real socket with a real second client attaching to it —
    # reconnect, layout persistence, signal delivery. None of that exists inside the unit suite,
    # which is why a defect in it once survived four hundred passing tests. macOS only: they use
    # BSD `stat -f` and `lsof`, and were written against Darwin's PTY behaviour.
    - name: Smoke (real daemon, real PTY)
      if: runner.os == 'macOS'
      run: |
        for script in scripts/smoke-slice6-macos.sh \
                      scripts/smoke-slice61-macos.sh \
                      scripts/smoke-slice62-nongit-macos.sh; do
          echo "── $script ──"
          sh "$script"
        done

    # A leaked daemon holds PTYs and child processes, and used to accumulate silently: the cleanup
    # searched an unresolved socket path, found nothing, and skipped its own kill. Failing here
    # keeps that from coming back unnoticed.
    - name: No daemon was left behind
      if: runner.os == 'macOS'
      run: |
        strays=$(pgrep -f 'dockd --socket=' | wc -l | tr -d ' ')
        echo "daemons still running: $strays"
        test "$strays" -eq 0
