[package]
name = "dock"
version = "0.1.0"
edition = "2024"
description = "A local-first runtime and control plane for coding agents"
license = "MIT"

[dependencies]
crossterm = "0.29"
nix = { version = "=0.29.0", features = ["process", "signal", "term"] }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
