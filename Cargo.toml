[workspace]
members = ["crates/*"]

[package]
name = "dock-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal multiplexer that understands coding agents"
license = "MIT"
repository = "https://github.com/ashark-ai-05/dock"
readme = "README.md"
keywords = ["tmux", "terminal", "multiplexer", "tui", "agents"]
categories = ["command-line-utilities", "development-tools"]
autobins = false

[lib]
name = "dock"
path = "src/lib.rs"

[[bin]]
name = "dock"
path = "src/main.rs"

[[bin]]
name = "dockd"
path = "src/bin/dockd.rs"

[dependencies]
base64 = "0.23"
crossterm = "0.29"
notify = "6.1"
nix = { version = "=0.29.0", features = ["process", "signal", "term"] }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-term = "0.3"
vt100 = "0.16"
dock-detect = { path = "crates/dock-detect" }
dock-git = { path = "crates/dock-git" }
dock-model = { path = "crates/dock-model" }
dock-pty = { path = "crates/dock-pty" }
dock-ui = { path = "crates/dock-ui" }

[dev-dependencies]
pretty_assertions = "1"
dock-testing = { path = "crates/dock-testing" }
