[package]
name = "dock-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Dock's daemon: socket server, dispatch, worktree binding, agent adapters."

[dependencies]
base64 = "0.23"
nix = { version = "=0.29.0", features = ["process", "signal", "term"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dock-detect = { path = "../dock-detect", version = "0.1.0" }
dock-git = { path = "../dock-git", version = "0.1.0" }
dock-model = { path = "../dock-model", version = "0.1.0" }
dock-pty = { path = "../dock-pty", version = "0.1.0" }
dock-receipt = { path = "../dock-receipt", version = "0.1.0" }

[dev-dependencies]
dock-testing = { path = "../dock-testing", version = "0.1.0" }
